name: Linia Goli – aktualizacja danych
# Sekret ODDS_API_KEY (the-odds-api.com) włącza kursy Ladbrokes, BetVictor i innych bukmacherów z UK.

on:
  schedule:
    - cron: "17 */4 * * *"   # co 4 godziny
  workflow_dispatch:          # ręczne uruchomienie: Actions → Run workflow
  push:
    branches: [main]
    paths: ["gole/engine.py", "gole/agent.py", "gole/nba.py", "gole/zrodla.py", ".github/workflows/linia-goli.yml"]

permissions:
  contents: write

concurrency:
  group: linia-goli
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # zakończone sezony pobieramy raz i trzymamy w pamięci podręcznej GitHuba
      - uses: actions/cache@v4
        with:
          path: gole/.cache
          key: fd-${{ github.run_id }}
          restore-keys: fd-

      - name: Zainstaluj numpy (obliczenia wag statystyk)
        run: pip install --quiet numpy

      - name: Pobierz wyniki i kursy, naucz model, przelicz typy, agent obstawia
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}   # darmowy klucz z the-odds-api.com (Ladbrokes, BetVictor)
        run: python gole/engine.py --out gole

      - name: Zapisz zmiany (dane i dziennik)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gole/data.json gole/journal.json gole/predictions.json gole/names.json gole/liga
          if [ -f gole/odds_cache.json ]; then git add gole/odds_cache.json; fi
          if [ -f gole/agent.json ]; then git add gole/agent.json gole/agent_analizy.json; fi   # agent: portfel, zakłady, nauka
          if [ -d gole/archiwum ]; then git add gole/archiwum; fi   # rozliczone typy starsze niż 120 dni, na stałe
          if git diff --cached --quiet; then
            echo "Bez zmian w danych"
          else
            git commit -m "Linia Goli: aktualizacja danych $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --quiet
            git push
          fi
